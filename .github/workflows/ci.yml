name: Candidate CI

on:
  push:
    branches:
      - 'stage/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: openssl version
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run audit:privacy
